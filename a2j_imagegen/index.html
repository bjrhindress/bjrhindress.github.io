<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2J Image Generation Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-weight: 700;
        }
        
        .category-select {
            margin-bottom: 30px;
        }
        
        .carousel-container {
            display: none;
            margin-top: 20px;
        }
        
        .carousel-container.active {
            display: block;
        }
        
        .carousel-inner {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .carousel-item img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            background-color: #f8f9fa;
            padding: 10px;
        }
        
        .generation-label {
            background-color: rgba(52, 152, 219, 0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            font-size: 14px;
        }
        
        .image-number {
            background-color: rgba(52, 152, 219, 0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            font-size: 14px;
        }
        
        .carousel-caption {
            background-color: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 10px;
            bottom: 20px;
        }
        
        .carousel-control-prev, .carousel-control-next {
            width: 50px;
            height: 50px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .carousel-control-prev {
            left: 10px;
        }
        
        .carousel-control-next {
            right: 10px;
        }
        
        .carousel-indicators {
            margin-bottom: -10px;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Access to Justice Image Generation Gallery</h1>
        
        <div class="category-select">
            <label for="imageCategory" class="form-label">Select Image Category:</label>
            <select class="form-select" id="imageCategory">
                <option value="" selected disabled>Choose a category...</option>
                <option value="1_volunteer_training_comic">1. Comic Book for Training Self-Help Center Volunteers</option>
                <option value="2_process_flyer">2. Process Flyer for Family Court Custody Cases</option>
                <option value="3_court_form_front_matter">3. Graphic Instruction Page for Court Forms</option>
                <option value="4_graphic_court_form">4. Redesigned Court Form with In-line Graphics</option>
                <option value="5_graphic_reminder">5. Graphic Summons/Court Reminder</option>
                <option value="6_graphic_faq">6. Graphic FAQ Page for Self-Represented Litigants</option>
                <option value="7_service_packet_inserts">7. Filings and Service Packet Inserts</option>
            </select>
        </div>
        
        <div id="carouselContainer" class="carousel-container">
            <div id="imageCarousel" class="carousel slide" data-bs-interval="false">
                <div class="carousel-indicators" id="carouselIndicators"></div>
                <div class="carousel-inner" id="carouselInner">
                    <div class="loading">Please select a category to view images</div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const categorySelect = document.getElementById('imageCategory');
            const carouselContainer = document.getElementById('carouselContainer');
            const carouselInner = document.getElementById('carouselInner');
            const carouselIndicators = document.getElementById('carouselIndicators');
            let carousel;
            
            // Map for display names of generation sources
            const sourceDisplayNames = {
                'openai': 'OpenAI GPT-4o',
                'gemini': 'Google Gemini Imagegen 3',
                'midjourney': 'MidJourney V7',
                'original_style': 'Original Source Image'
            };
            
            categorySelect.addEventListener('change', async function() {
                const selectedCategory = this.value;
                if (!selectedCategory) return;
                
                // Show loading state
                carouselContainer.classList.add('active');
                carouselInner.innerHTML = '<div class="loading">Loading images...</div>';
                carouselIndicators.innerHTML = '';
                
                try {
                    // Use fetch API to get directory listing
                    // In a real environment, you would need a server-side script to list files
                    // This is a simplified approach using a mock fetch that simulates the directory structure
                    const images = await fetchImagesForCategory(selectedCategory);
                    
                    if (images.length === 0) {
                        carouselInner.innerHTML = '<div class="loading">No images found in this category</div>';
                        return;
                    }
                    
                    // Build carousel items
                    carouselInner.innerHTML = '';
                    carouselIndicators.innerHTML = '';
                    
                    // Map folder values to their order numbers
                    const folderNumbers = {
                        '1_volunteer_training_comic': 1,
                        '2_process_flyer': 2,
                        '3_court_form_front_matter': 3,
                        '4_graphic_court_form': 4,
                        '5_graphic_reminder': 5,
                        '6_graphic_faq': 6,
                        '7_service_packet_inserts': 7
                    };
                    
                    images.forEach((image, index) => {
                        // Create carousel item
                        const carouselItem = document.createElement('div');
                        carouselItem.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                        
                        // Create image
                        const img = document.createElement('img');
                        img.src = image.path;
                        img.className = 'd-block w-100';
                        img.alt = `Image ${folderNumbers[selectedCategory]}.${index + 1}`;
                        
                        // Create source label
                        const sourceLabel = document.createElement('div');
                        sourceLabel.className = 'generation-label';
                        sourceLabel.textContent = sourceDisplayNames[image.source] || image.source;
                        
                        // Create image number label with hierarchical numbering
                        const imageNumber = document.createElement('div');
                        imageNumber.className = 'image-number';
                        imageNumber.textContent = `Image ${folderNumbers[selectedCategory]}.${index + 1}`;
                        
                        // Add elements to carousel item
                        carouselItem.appendChild(img);
                        carouselItem.appendChild(sourceLabel);
                        carouselItem.appendChild(imageNumber);
                        carouselInner.appendChild(carouselItem);
                        
                        // Add indicator
                        const indicator = document.createElement('button');
                        indicator.type = 'button';
                        indicator.dataset.bsTarget = '#imageCarousel';
                        indicator.dataset.bsSlideTo = index;
                        if (index === 0) indicator.className = 'active';
                        indicator.setAttribute('aria-current', index === 0 ? 'true' : 'false');
                        indicator.setAttribute('aria-label', `Image ${folderNumbers[selectedCategory]}.${index + 1}`);
                        carouselIndicators.appendChild(indicator);
                    });
                    
                    // Initialize or refresh carousel
                    if (carousel) {
                        carousel.dispose();
                    }
                    
                    // Remove any auto-cycling attributes
                    const carouselElement = document.getElementById('imageCarousel');
                    carouselElement.removeAttribute('data-bs-ride');
                    carouselElement.setAttribute('data-bs-interval', 'false');
                    
                    // Initialize carousel with auto-cycling disabled
                    carousel = new bootstrap.Carousel(carouselElement, {
                        interval: false,
                        ride: false,
                        wrap: true, // Allow wrapping around at the end
                        pause: true // Pause on hover
                    });
                    
                    // Double-check by manually pausing after initialization
                    setTimeout(() => {
                        if (carousel) carousel.pause();
                    }, 100);
                    
                } catch (error) {
                    console.error('Error loading images:', error);
                    carouselInner.innerHTML = `<div class="loading">Error loading images: ${error.message}</div>`;
                }
            });
            
            // Function to simulate fetching images from directory
            // In a real application, this would be a server-side API call
            async function fetchImagesForCategory(category) {
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Get directory structure from your file tree
                const directoryStructure = {
                    '1_volunteer_training_comic': [
                        { source: 'gemini', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) },
                        { source: 'midjourney', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) },
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '2_process_flyer': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) },
                        { source: 'original_style', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '3_court_form_front_matter': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '4_graphic_court_form': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '5_graphic_reminder': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '6_graphic_faq': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ],
                    '7_service_packet_inserts': [
                        { source: 'openai', files: Array.from({length: 20}, (_, i) => `Picture${i+1}.png`) }
                    ]
                };
                
                // Get sources and files for the selected category
                const categoryData = directoryStructure[category];
                if (!categoryData) return [];
                
                // Convert to array of image objects with path and source
                const images = [];
                const imagePromises = [];
                
                categoryData.forEach(sourceData => {
                    sourceData.files.forEach(filename => {
                        const path = `media/${category}/${sourceData.source}/${filename}`;
                        // Create a promise to check if the image exists
                        const imagePromise = checkImageExists(path).then(exists => {
                            if (exists) {
                                images.push({
                                    path: path,
                                    source: sourceData.source,
                                    filename: filename
                                });
                            }
                        });
                        imagePromises.push(imagePromise);
                    });
                });
                
                // Wait for all image checks to complete
                await Promise.all(imagePromises);
                
                // Sort images first by source priority (openai -> gemini -> midjourney -> others)
                // then alphabetically by filename within each source group
                const sourcePriority = {
                    'openai': 1,
                    'gemini': 2,
                    'midjourney': 3,
                    'original_style': 4
                };
                
                images.sort((a, b) => {
                    // First sort by source priority
                    const sourceOrderA = sourcePriority[a.source] || 999;
                    const sourceOrderB = sourcePriority[b.source] || 999;
                    
                    if (sourceOrderA !== sourceOrderB) {
                        return sourceOrderA - sourceOrderB;
                    }
                    
                    // If sources are the same, sort by filename
                    return a.filename.localeCompare(b.filename, undefined, {numeric: true, sensitivity: 'base'});
                });
                
                return images;
            }

            // Function to check if an image exists
            function checkImageExists(url) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }
        });
    </script>
</body>
</html>
